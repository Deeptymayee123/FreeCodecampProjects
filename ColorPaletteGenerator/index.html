<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Color Palette Generator</h1>
      <button id="generate-btn">
        <i class="fa-solid fa-rotate"></i>Genarate Palette
      </button>

      <div class="palette-container">
        <!-- color box 1 -->
        <div class="color-box">
          <div class="color" style="background-color: #133a3d"></div>
          <div class="color-info">
            <span class="hex-value">#E1F5FE </span>
            <i
              class="fa-regular fa-copy copy-btn"
              title="copy to clipboard"
            ></i>
          </div>
        </div>
        <!-- color box 2 -->
        <div class="color-box">
          <div class="color" style="background-color: #9be7ed"></div>
          <div class="color-info">
            <span class="hex-value">#E1F5FE </span>
            <i
              class="fa-regular fa-copy copy-btn"
              title="copy to clipboard"
            ></i>
          </div>
        </div>
        <!-- color box 3 -->
        <div class="color-box">
          <div class="color" style="background-color: #0bd6e4"></div>
          <div class="color-info">
            <span class="hex-value">#E1F5FE </span>
            <i
              class="fa-regular fa-copy copy-btn"
              title="copy to clipboard"
            ></i>
          </div>
        </div>
        <!-- color box 4 -->
        <div class="color-box">
          <div class="color" style="background-color: #4fe0e8"></div>
          <div class="color-info">
            <span class="hex-value">#E1F5FE </span>
            <i
              class="fa-regular fa-copy copy-btn"
              title="copy to clipboard"
            ></i>
          </div>
        </div>
        <!-- color box 5@import url(https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic); -->
        <div class="color-box">
          <div class="color" style="background-color: #ddecec"></div>
          <div class="color-info">
            <span class="hex-value">#E1F5FE </span>
            <i
              class="fa-regular fa-copy copy-btn"
              title="copy to clipboard"
            ></i>
          </div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
    <script
      src="https://kit.fontawesome.com/ae8dfe5513.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
