<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Mark</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Book Mark Saver</h1>
      <div class="app-container">
        <input
          type="text"
          id="bookmark-name"
          class="input"
          placeholder="Enter bookmark name"
        />
        <input
          type="text"
          id="bookmark-url"
          class="input"
          placeholder="Enter bookmark URL"
        />
        <button id="Added-bookmark">Add BookMark</button>
      </div>
      <ul id="All-Book-Mark"></ul>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
