<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start-screen">
        <h1>Quiz Time</h1>
        <p>Test your knowledge with these fun questions</p>
        <button id="startBtn">Start Quiz</button>
      </div>
      <div class="screen" id="quiz-screen">
        <div class="content">
          <p class="question-text">Question: How are you?</p>
          <div class="qnumberScore">
            <p>
              Questions <span id="qNumber"></span> of
              <span id="qTotal"></span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>
        <div id="answers-container" class="answers-container">
          <!-- Answer buttons will be inserted here from our js code later at some point -->
        </div>
        <div class="progres-bar">
          <div id="progres" class="progres"></div>
        </div>
      </div>
      <div class="screen" id="result-screen">
        <h1>Quiz Results</h1>
        <p>
          You scored <span class="scoreGet"></span> out of
          <span class="scoreTotal"></span>
        </p>
        <p id="resultMsg">Good Effort! keep learning!</p>
        <button class="restartQuiz">Restart Quiz</button>
      </div>
    </div>
    <script src="./script1.js"></script>
    <!-- <script src="./script.js"></script> -->
  </body>
</html>
