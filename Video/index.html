<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>

    <!-- styles -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- preloader -->
    <div class="preloader">
      <img src="./preloader.gif" alt="preloader" class="preloader__item" />
    </div>
    <!-- header -->
    <header>
      <!-- controls → Shows video buttons (play, pause, volume, fullscreen).
muted → Video starts with no sound.
autoplay → Video starts playing automatically when page loads.
loop → Video repeats again and again after ending.
class="video-container" → Applies CSS styles written for .video-container. -->

      <video controls muted autoplay loop class="video-container">
        <source src="./12181639_2160_3840_25fps.mp4" type="video/mp4" />
      </video>
      <h1>video project</h1>
      <!-- video switch -->
      <button class="switch-btn">
        <span> play </span>
        <span> pause </span>
        <span class="switch"></span>
      </button>
    </header>
    <!-- javascript -->
    <script src="./script.js"></script>
  </body>
</html>
