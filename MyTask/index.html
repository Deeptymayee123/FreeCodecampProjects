<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My task</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>
          <i class="fa-solid fa-circle-check"></i>
          My Tasks
        </h1>
        <p id="date">date</p>
      </header>

      <div class="todo-input">
        <input
          type="text"
          id="task-input"
          placeholder="What do you need to do?"
        />
        <button id="add-task"><i class="fa-solid fa-square-plus"></i></button>
      </div>
      <div class="filters">
        <span class="filter" data-filter="all">All</span>
        <span class="filter" data-filter="active">Active</span>
        <span class="filter" data-filter="completed">Completed</span>
      </div>

      <div class="todos-container">
        <ul id="todo-list">
          <!-- li will be inserted right here -->
          <li class="todo-item">
            <label class="checkbox-container">
              <input type="checkbox" class="todo-checkbox" />
              <span class="checkmark"></span>
            </label>
            <span class="todo-item-text">Buy gloceries</span>
            <button class="delete-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </li>
        </ul>

        <div class="empty-state hidden">
          <i class="fa-solid fa-clipboard-list"></i>
          <p>No tasks here yet</p>
        </div>
      </div>
      <footer>
        <p id="items-left">0 items left</p>
        <button id="clear-completed">Clear Completed</button>
      </footer>
    </div>
    <script src="./script.js"></script>
    <script
      src="https://kit.fontawesome.com/ae8dfe5513.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
